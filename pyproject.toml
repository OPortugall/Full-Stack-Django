[project]
name = "desenvolvimento-fullstack-com-django"
version = "0.1.0"
description = ""
authors = [
    {name = "Oportugall",email = "lemgruberportugalleonardo@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipython",
    "pytest-django"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mysite.settings"

[tool.isort]
profile = "black"
